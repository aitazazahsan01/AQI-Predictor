name: Deploy Website

# Publishes the Next.js front end to GitHub Pages.
#
# ONE-TIME SETUP: Settings > Pages > Build and deployment > Source: GitHub
# Actions. Until that is switched on, the deploy step fails with "Pages is not
# enabled" - the build step still passes, so the failure is loud but harmless.
#
# Deploying to Vercel instead? Point it at the `web/` directory and delete this
# file; the site is a plain static export either way.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy_web.yml"
  workflow_dispatch:

# One live site: never let two deploys race. In-progress runs are cancelled
# because only the newest content matters.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Build static site
        working-directory: web
        # Pages serves from /<repo>/, so the bundle needs that prefix baked in.
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
