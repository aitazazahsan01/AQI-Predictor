name: Daily Aggregation and Training

# Aggregation and training share one workflow because training is only
# meaningful once the day's features exist. Two independently-scheduled jobs
# could race; sequential steps here cannot.
on:
  schedule:
    # 00:20 UTC - after the last hourly run of the previous UTC day has landed.
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      skip_training:
        description: "Aggregate features but don't retrain"
        type: boolean
        required: false
        default: false

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  # The published snapshot is committed back to the repository.
  contents: write

jobs:
  aggregate-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # Training set includes TensorFlow for the LSTM candidate. Pinned to a
        # Python version TensorFlow publishes wheels for - it lags new releases.
        run: pip install -r requirements-train.txt

      - name: Aggregate yesterday into daily features
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: python scripts/run_daily_aggregation.py

      - name: Retrain and register models
        if: ${{ !inputs.skip_training }}
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: python scripts/run_training_pipeline.py

      # The website is static and holds no credentials, so this job - which
      # already has them - is the only place that can produce its data.
      - name: Export the snapshot for the website
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
        run: python scripts/export_web_data.py

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/forecast.json
          # Nothing to commit is a normal outcome on a re-run, not a failure.
          if git diff --staged --quiet; then
            echo "Snapshot unchanged."
          else
            # No [skip ci]: this commit is exactly what should trigger a
            # redeploy of the website.
            git commit -m "data: refresh forecast snapshot"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
