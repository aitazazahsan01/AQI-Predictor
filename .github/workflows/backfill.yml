name: Historical Backfill

# Manually triggered, not scheduled — this is a one-off seeding job.
#
# Running it here rather than locally is also the reliable option: writing to the
# Hopsworks offline store needs outbound access to HopsFS (:8020) and Kafka
# (:9092), which many campus/corporate networks block. GitHub runners don't.
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First day to backfill (YYYY-MM-DD). Blank = earliest available."
        required: false
        default: "2022-08-05"
      end_date:
        description: "Last day to backfill (YYYY-MM-DD). Blank = yesterday."
        required: false
        default: ""
      dry_run:
        description: "Fetch and summarise without writing anything"
        type: boolean
        required: false
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Fail in seconds on a misconfiguration rather than after a long install.
      # Only emptiness is checked - values are never printed.
      - name: Check required secrets
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: |
          missing=""
          [ -z "$HOPSWORKS_API_KEY" ] && missing="$missing HOPSWORKS_API_KEY"
          [ -z "$HOPSWORKS_PROJECT_NAME" ] && missing="$missing HOPSWORKS_PROJECT_NAME"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "Names are case-sensitive and must match exactly."
            exit 1
          fi
          echo "Required secrets are present."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Built as an array so a blank input drops the flag entirely rather
          # than passing a dangling "--start-date" with no value.
          ARGS=()
          [ -n "$START_DATE" ] && ARGS+=(--start-date "$START_DATE")
          [ -n "$END_DATE" ] && ARGS+=(--end-date "$END_DATE")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          echo "Running: python scripts/backfill_historical.py ${ARGS[*]}"
          python scripts/backfill_historical.py "${ARGS[@]}"
